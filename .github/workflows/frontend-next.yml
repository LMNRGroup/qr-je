name: frontend-next

on:
  push:
    branches: [main]
    paths:
      - 'frontend-next/**'
      - '.github/workflows/frontend-next.yml'
  pull_request:
    paths:
      - 'frontend-next/**'
      - '.github/workflows/frontend-next.yml'

defaults:
  run:
    working-directory: frontend-next

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:8081
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend-next/.nvmrc
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke
